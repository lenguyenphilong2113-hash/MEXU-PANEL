<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEXU PANEL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b14;color:#eef2ff;font-family:Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 15% 0%,#18244b 0,transparent 38%),radial-gradient(circle at 100% 100%,#281344 0,transparent 35%)}
.wrap{max-width:760px;margin:auto;padding:22px 15px 50px}.brand{text-align:center;padding:22px 10px}.brand h1{margin:0;font-size:30px;letter-spacing:4px;color:#77e8ff;text-shadow:0 0 18px #00bfff}.brand p{color:#9eabc9;font-size:12px;letter-spacing:2px}
.panel{background:#11182a;border:1px solid #293756;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 12px 35px #0006}.panel h2{font-size:18px;margin:0 0 14px;color:#8cecff}
input,button{font:inherit;border-radius:12px;border:1px solid #344665;padding:13px;background:#0b1120;color:#fff;width:100%;outline:none}input:focus{border-color:#65dcff}button{cursor:pointer;background:linear-gradient(100deg,#087ca8,#5c3bb2);border:0;font-weight:bold;margin-top:9px}button:disabled{opacity:.55;cursor:wait}
.note{font-size:12px;color:#9ba9c7;line-height:1.5}.status{font-size:14px;margin-top:10px;color:#8cf0bb;min-height:20px}.groups{display:grid;gap:14px}.group{border:1px solid #2b3b5b;border-radius:25px;overflow:hidden;background:#0c1322}.groupHead{padding:20px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:bold;color:#f4f7ff;font-size:20px}.groupHead span:last-child{color:#75dfff}.items{display:none;padding:10px 14px 16px;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.group.open .items{display:grid}.item{padding:17px 8px;background:#12372f;border:1px solid #48b995;border-radius:17px;text-align:center;font-size:15px;color:#aaffdd;cursor:pointer;box-shadow:0 0 14px #26d6a344;min-height:60px}.item.active{border-color:#7dffd2;background:#185441;color:#fff}.item.locked{opacity:.58;border-color:#516078;background:#172033;color:#bdc7d9}.foot{text-align:center;color:#8290ad;font-size:11px;margin-top:22px}.hidden{display:none}.access{display:grid;grid-template-columns:1fr auto;gap:8px}.access button{margin:0;padding-left:17px;padding-right:17px}.loading{display:flex;align-items:center;gap:10px;color:#8cecff}.spin{width:17px;height:17px;border:2px solid #38506a;border-top-color:#71e9ff;border-radius:50%;animation:rot .8s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}@keyframes glow{0%,100%{text-shadow:0 0 5px #00d9ff}50%{text-shadow:0 0 18px #b45cff,0 0 28px #00d9ff}}.brand h1{animation:glow 1.5s infinite}@media(max-width:420px){.items{grid-template-columns:1fr 1fr}.access{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<header class="brand"><h1>MEXU PANEL</h1><p>GAMING CONTROL CENTER</p></header>
<section class="panel" id="gate"><h2>🔐 NHẬP KEY CHỨC NĂNG</h2><input id="firstKey" placeholder="Nhập key chức năng hoặc key ALL" autocomplete="off"><button onclick="submitFirst()">XÁC NHẬN KEY</button><div class="status" id="gateStatus"></div><p class="note">Mỗi chức năng nhỏ có một key riêng. Key ALL mở toàn bộ chức năng.</p></section>
<section class="panel hidden" id="app"><h2>🔑 MỞ KHÓA THÊM CHỨC NĂNG</h2><div class="access"><input id="moreKey" placeholder="Nhập key chức năng khác"><button onclick="addKey()">MỞ KEY</button></div><div class="status" id="keyStatus"></div></section>
<section class="panel hidden" id="mainPanel"><h2>⚡ DANH SÁCH CHỨC NĂNG</h2><div class="groups" id="groups"></div><div class="status" id="actionStatus"></div><button onclick="launchGame()">🎮 VÀO FREE FIRE</button><p class="note">Nút sẽ mở Free Fire nếu trò chơi đã được cài đặt trên thiết bị.</p></section>
<div class="foot">MEXU PANEL • LOCAL INTERFACE</div></main>
<script>
const groups=[
{id:'DVI',name:'DVI',items:['DVI NHÁY NHÁY','DVI SKIN SÚNG','DVI RAINBOW']},
{id:'AIM',name:'AIM + ĐỒ',items:['AIM ĐẦU','AIM NECK','AIM CỔ','AIM 80%','AIM 60%','AIM 40%','AIM 20%','CỔ DÀI','KILL AURA','TELE (DỊCH CHUYỂN) + AIM ĐẦU']},
{id:'FIXLAG',name:'FIXLAG',items:['ĐỒ HOẠ MINECRAFT','V1','V2','V3']}];
const allFeatures=groups.flatMap(g=>g.items);
const unlocked=new Set(), active=new Set(), busy=new Set();
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Đ/g,'D').replace(/đ/g,'d').toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'')}
function parseKey(raw){let p=raw.trim().toUpperCase().split('-');if(p.length!==3||p[0]!=='MX'||!/^[A-F0-9]{8}$/.test(p[2]))return null;if(p[1]==='ALL')return 'ALL';return allFeatures.find(x=>slug(x)===p[1])||null}
function grant(raw){let k=parseKey(raw);if(!k)return false;if(k==='ALL')allFeatures.forEach(x=>unlocked.add(x));else unlocked.add(k);return true}
function submitFirst(){let s=document.getElementById('gateStatus');if(!grant(document.getElementById('firstKey').value)){s.style.color='#ff9aab';s.textContent='KEY KHÔNG HỢP LỆ';return}document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('mainPanel').classList.remove('hidden');render()}
function addKey(){let el=document.getElementById('moreKey'),s=document.getElementById('keyStatus');if(!grant(el.value)){s.style.color='#ff9aab';s.textContent='KEY KHÔNG HỢP LỆ';return}s.style.color='#8cf0bb';s.textContent='ĐÃ MỞ KHÓA KEY';el.value='';render()}
function render(){let root=document.getElementById('groups');root.innerHTML='';groups.forEach(g=>{let box=document.createElement('div');box.className='group open';let head=document.createElement('div');head.className='groupHead';let title=document.createElement('span');title.textContent=g.name;let sign=document.createElement('span');sign.textContent='−';head.append(title,sign);let items=document.createElement('div');items.className='items';g.items.forEach(name=>{let b=document.createElement('button');b.className='item'+(active.has(name)?' active':'')+(!unlocked.has(name)?' locked':'');b.textContent=name+(!unlocked.has(name)?' 🔒':'');b.disabled=busy.has(name);b.onclick=()=>activate(name,b);items.appendChild(b)});head.onclick=()=>{box.classList.toggle('open');sign.textContent=box.classList.contains('open')?'−':'+'};box.append(head,items);root.appendChild(box)})}
function activate(name,b){if(!unlocked.has(name)){document.getElementById('actionStatus').textContent='Chức năng này cần key riêng.';return}if(busy.has(name))return;busy.add(name);let seconds=10+Math.floor(Math.random()*11),left=seconds;b.disabled=true;b.innerHTML='<span class="loading"><i class="spin"></i> ĐANG TRUY CẬP DỮ LIỆU '+left+'s</span>';let timer=setInterval(()=>{left--;if(left>0){b.innerHTML='<span class="loading"><i class="spin"></i> ĐANG TRUY CẬP DỮ LIỆU '+left+'s</span>';return}clearInterval(timer);busy.delete(name);if(active.has(name))active.delete(name);else active.add(name);document.getElementById('actionStatus').textContent=name+(active.has(name)?' • ĐÃ BẬT':' • ĐÃ TẮT');render()},1000)}
function launchGame(){let intent='intent://#Intent;scheme=freefire;package=com.dts.freefireth;end';location.href=intent;setTimeout(()=>{location.href='intent://#Intent;scheme=freefire;package=com.dts.freefiremax;end'},1200)}
</script></body></html>
