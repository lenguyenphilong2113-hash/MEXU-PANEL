<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEXU KEY MAKER</title><style>
*{box-sizing:border-box}body{margin:0;background:#080b14;color:#eef2ff;font-family:Arial,sans-serif;background-image:radial-gradient(circle at 10% 0%,#1c3154,transparent 40%)}main{max-width:650px;margin:auto;padding:25px 16px}.head{text-align:center;padding:20px}.head h1{color:#78eaff;letter-spacing:3px;margin:0;text-shadow:0 0 15px #00bfff}.card{background:#11182a;border:1px solid #293756;border-radius:17px;padding:19px;margin:15px 0}label{display:block;color:#9fafd0;font-size:13px;margin:14px 0 7px}select,button{width:100%;padding:13px;border-radius:10px;border:1px solid #354969;background:#0a1120;color:white;font-size:15px}button{border:0;background:linear-gradient(100deg,#087ca8,#5c3bb2);font-weight:bold;margin-top:16px;cursor:pointer}.key{font-size:18px;color:#8fffd2;overflow-wrap:anywhere;padding:14px;background:#0a1120;border-radius:10px;margin-top:15px;min-height:48px}.small{font-size:12px;color:#9ba9c7;line-height:1.6}.list{margin-top:14px;font-size:13px;color:#c5d3ee}.entry{padding:10px;border-bottom:1px solid #293756;overflow-wrap:anywhere}
</style></head><body><main><header class="head"><h1>MEXU KEY MAKER</h1><p class="small">TẠO KEY CHO TỪNG CHỨC NĂNG NHỎ</p></header><section class="card"><h3>⚙️ TẠO KEY MỚI</h3><label>Chọn chức năng</label><select id="kind"><option value="ALL">KEY ALL - MỞ TẤT CẢ</option><option value="DVI NHÁY NHÁY">KEY DVI NHÁY NHÁY</option><option value="DVI SKIN SÚNG">KEY DVI SKIN SÚNG</option><option value="DVI RAINBOW">KEY DVI RAINBOW</option><option value="AIM ĐẦU">KEY AIM ĐẦU</option><option value="AIM NECK">KEY AIM NECK</option><option value="AIM CỔ">KEY AIM CỔ</option><option value="AIM 80%">KEY AIM 80%</option><option value="AIM 60%">KEY AIM 60%</option><option value="AIM 40%">KEY AIM 40%</option><option value="AIM 20%">KEY AIM 20%</option><option value="CỔ DÀI">KEY CỔ DÀI</option><option value="KILL AURA">KEY KILL AURA</option><option value="TELE (DỊCH CHUYỂN) + AIM ĐẦU">KEY TELE (DỊCH CHUYỂN) + AIM ĐẦU</option><option value="ĐỒ HOẠ MINECRAFT">KEY ĐỒ HOẠ MINECRAFT</option><option value="V1">KEY V1</option><option value="V2">KEY V2</option><option value="V3">KEY V3</option></select><button onclick="makeKey()">TẠO KEY</button><div class="key" id="result">KEY SẼ HIỆN Ở ĐÂY</div><button onclick="copyKey()">SAO CHÉP KEY</button><div class="small" id="msg"></div></section><section class="card"><h3>📋 LỊCH SỬ KEY TRÊN THIẾT BỊ</h3><div id="history" class="list">Chưa có key nào.</div></section></main>
<script>
let current='',history=[];
function slug(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/Đ/g,'D').replace(/đ/g,'d').toUpperCase().replace(/[^A-Z0-9]+/g,'_').replace(/^_|_$/g,'')}
function makeKey(){let kind=document.getElementById('kind').value,bytes=new Uint8Array(4);if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(bytes);else for(let i=0;i<4;i++)bytes[i]=Math.floor(Math.random()*256);let token=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('').toUpperCase();current='MX-'+(kind==='ALL'?'ALL':slug(kind))+'-'+token;document.getElementById('result').textContent=current;document.getElementById('msg').textContent='Đã tạo key: '+kind;history.unshift(current);draw()}
function copyKey(){if(!current){document.getElementById('msg').textContent='Hãy tạo key trước.';return}if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(current).then(()=>document.getElementById('msg').textContent='Đã sao chép key.').catch(()=>document.getElementById('msg').textContent='Nhấn giữ key để sao chép.');else document.getElementById('msg').textContent='Nhấn giữ key để sao chép.'}
function draw(){document.getElementById('history').innerHTML=history.map(k=>'<div class="entry">'+k+'</div>').join('')}
</script></body></html>
